services:
  label-studio:
    image: heartexlabs/label-studio:1.9.0  # Specific version for consistency
    ports:
      - "8080:8080"
    environment:
      - LABEL_STUDIO_HOST=0.0.0.0
      - LABEL_STUDIO_PORT=8080
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data
    volumes:
      - ./label-studio-data:/label-studio/data
    networks:
      - raise-network

  ml-backend:
    build:
      context: ./ml-backend
      dockerfile: Dockerfile.ml
    ports:
      - "9090:9090"
    volumes:
      - ./ml-backend:/app
    environment:
      - LABEL_STUDIO_ML_BACKEND_PORT=9090
    depends_on:
      - label-studio
    networks:
      - raise-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - IMAGE_SOURCE_DIR=/app/static
    depends_on:
      ml-backend:
        condition: service_healthy
      label-studio:
        condition: service_started
    networks:
      - raise-network

networks:
  raise-network:
    driver: bridge